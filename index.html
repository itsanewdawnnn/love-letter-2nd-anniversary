<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Istriku Tercinta</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Google Fonts untuk nuansa elegan dan romantis -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Partikel Hati yang berjatuhan pelan -->
    <div class="particles" id="particles"></div>

    <!-- Efek Blur Background yang muncul saat surat perlahan dibaca -->
    <div class="bg-blur" id="bgBlur"></div>

    <!-- Container Efek Burst Kelopak/Confetti saat transisi amplop -> surat -->
    <div class="burst-container" id="burstContainer"></div>

    <main class="container" id="mainContainer">
        
        <!-- Layar Intro (Tampilan Amplop) -->
        <section class="intro-screen" id="introScreen">
            <div class="header-decoration">
                <div class="anniversary-mark">Hari Jadi Kedua</div>
                <div class="mark-line"></div>
            </div>

            <div class="envelope-wrapper" id="envelopeWrapper">
                <div class="envelope" id="envelope">
                    <!-- Bagian-bagian penyusun amplop -->
                    <div class="envelope-back"></div>
                    <div class="envelope-letter" id="envelopeLetter">
                        <div class="letter-peak-text">"Teruntuk kamu yang menjadikanku<br>versi terbaik dari diriku sendiri..."</div>
                    </div>
                    <div class="envelope-flap"></div>
                    <div class="envelope-sides"></div>
                    <div class="envelope-front"></div>
                    <!-- Segel lilin (Wax seal) bentuk hati -->
                    <div class="envelope-seal">❤</div>
                </div>
            </div>
            
            <p class="subtitle">"Untuk wanita yang selalu menjadi rumah bagiku."</p>
            
            <button class="btn-open" id="btnOpen">Buka Surat</button>
        </section>

    </main>

    <!-- Layar Surat (Teks Berjalan/Mesin Tik) -->
    <section class="letter-screen hidden" id="letterScreen">
        <div class="letter-container" id="letterContainer">
            <h1 class="letter-title">Happy 2nd Anniversary
                <span class="sparkle sparkle-1">✦</span>
                <span class="sparkle sparkle-2">✧</span>
                <span class="sparkle sparkle-3">✦</span>
                <span class="sparkle sparkle-4">✧</span>
            </h1>
            <div class="letter-content">
                <span id="typewriterText"></span><span class="cursor"></span>
            </div>
            <div class="letter-stamp" id="letterStamp">Dengan penuh cinta,<br>Suamimu</div>
        </div>
    </section>

    <!-- Musik Latar -->
    <audio id="bgMusic" src="assets/music/music.mp3" loop preload="auto"></audio>

    <!-- Vanilla JavaScript -->
    <script src="assets/js/script.js"></script>
</body>
</html>
